name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-test:
    name: Backend — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          REDIS_URL: mock
      - run: npm run session:smoke
        env:
          REDIS_URL: mock

  backend-penai-integration:
    name: Backend — PENAI Postgres integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: penai
          POSTGRES_PASSWORD: penai_secret
          POSTGRES_DB: penai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U penai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Bootstrap schema (dev sync)
        run: npx tsx -e "import { initPenaiDatabase, PenaiDataSource } from './src/GameMaster/database/data-source.js'; await initPenaiDatabase(); await PenaiDataSource.destroy();"
        env:
          DATABASE_URL: postgres://penai:penai_secret@localhost:5432/penai
          PENAI_DB_SYNC: 'true'
      - run: npm run penai:migration:run
        env:
          DATABASE_URL: postgres://penai:penai_secret@localhost:5432/penai
          PENAI_DB_SYNC: 'false'
      - run: npm run penai:seed:srd-ptbr
        env:
          DATABASE_URL: postgres://penai:penai_secret@localhost:5432/penai
          PENAI_DB_SYNC: 'true'
      - run: node --test --import tsx src/__tests__/penaiSeedSrdPtBr.spec.ts
        env:
          DATABASE_URL: postgres://penai:penai_secret@localhost:5432/penai
          PENAI_DB_SYNC: 'true'
          REDIS_URL: mock
      - run: node --test --import tsx src/__tests__/penaiCampaignSurvival.spec.ts
        env:
          DATABASE_URL: postgres://penai:penai_secret@localhost:5432/penai
          PENAI_DB_SYNC: 'true'
          REDIS_URL: mock

  frontend-check:
    name: Frontend — lint e typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  srd-snapshot:
    name: SRD — snapshot offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-srd-snapshot.js

  migration-compile:
    name: Backend — compilar migrações
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
