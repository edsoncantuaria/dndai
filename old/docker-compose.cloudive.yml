# Homolog Cloudive — PENAI (Postgres + Temporal + Fastify v2)
#
# Subir:
#   docker compose -f docker-compose.yml -f docker-compose.penai.yml -f docker-compose.cloudive.yml --profile penai up -d --build
# ou: npm run deploy:cloudive
#
# Tunnel Cloudflare:
#   api-rpg.cloudive.com.br → localhost:9011
#   dnd.cloudive.com.br     → localhost:9012

name: dndai-penai

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  qdrant:
    ports: !reset []

  temporal:
    ports: !reset []

  temporal-ui:
    ports: !reset []

  penai-api:
    ports: !override
      - '9011:8071'
    environment:
      RUNNING_IN_DOCKER: 'true'
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api-rpg.cloudive.com.br/api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dnd.cloudive.com.br,http://dnd.cloudive.com.br,https://api-rpg.cloudive.com.br}
      SRD_API_BASE: http://srd-api:3000/api/2014
      MINIO_ENABLED: 'true'
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dndai_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dndai_minio_secret}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-chronicles}
      PIPER_HTTP_URL: http://piper:5500
    depends_on:
      srd-api:
        condition: service_started
      minio:
        condition: service_healthy
      piper:
        condition: service_healthy

  penai-temporal-worker:
    environment:
      RUNNING_IN_DOCKER: 'true'
      SRD_API_BASE: http://srd-api:3000/api/2014

  frontend:
    profiles: [penai]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-rpg.cloudive.com.br/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api-rpg.cloudive.com.br/}
    restart: unless-stopped
    ports: !override
      - '9012:9002'
    depends_on:
      penai-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9002').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
