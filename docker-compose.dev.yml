# Hot reload dentro do Docker (opcional).
# Uso: npm run dev:docker
#
# Requer infra rodando: npm run dev:infra (ou já estiver up)

name: dndai

services:
  backend-dev:
    profiles: ['dev']
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
    environment:
      NODE_ENV: development
      PORT: 8071
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-dndai}
      DB_PASSWORD: ${DB_PASSWORD:-dndai_secret}
      DB_NAME: ${DB_NAME:-dndai}
      DB_SYNC: ${DB_SYNC:-true}
      REDIS_URL: redis://redis:6379
      SRD_API_BASE: http://srd-api:3000/api/2014
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AI_PIPELINE_MODE: ${AI_PIPELINE_MODE:-narration_only}
    ports:
      - '8071:8071'
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["npx", "tsx", "watch", "src/server.ts"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-dev:
    profiles: ['dev']
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8071/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8071/}
      WATCHPACK_POLLING: 'true'
    ports:
      - '9002:9002'
    command: sh -c "test -f node_modules/.package-lock.json || npm ci; npm run dev -- -H 0.0.0.0"
    depends_on:
      - backend-dev

volumes:
  frontend_node_modules:
