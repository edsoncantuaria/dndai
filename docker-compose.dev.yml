# Hot reload dentro do Docker (opcional).
# Uso: npm run dev:docker  (mesmo project name que docker-compose.penai.yml)
#
# Sobe junto com infra PENAI (Postgres, Redis, Temporal, Qdrant) no profile penai.

name: dndai-penai

x-penai-dev-env: &penai-dev-env
  NODE_ENV: development
  PENAI_PIPELINE_LOG: ${PENAI_PIPELINE_LOG:-1}
  AI_DEBUG_LOGS: ${AI_DEBUG_LOGS:-1}
  DEFAULT_LOCALE: pt-BR
  API_VERSION: v2
  DATABASE_URL: postgres://penai:penai_secret@postgres:5432/penai
  REDIS_URL: redis://redis:6379
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: penai
  PENAI_DB_SYNC: ${PENAI_DB_SYNC:-true}
  PENAI_SEED_ON_BOOT: ${PENAI_SEED_ON_BOOT:-true}
  # API não embute worker; narração via fila Temporal (serviço temporal-worker-dev).
  SKIP_TEMPORAL_WORKER: 'true'
  JWT_SECRET: ${JWT_SECRET:-change-me-use-openssl-rand-hex-32}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  AI_PIPELINE_MODE: narration_only
  AI_ENGINE: gemini
  AI_PROVIDER: gemini
  AI_DEFAULT_MODEL: gemini-2.5-flash
  AI_FAILOVER_CHAIN: gemini-2.5-flash,gemini-2.5-flash-lite
  AI_OPENROUTER_ONLY: 'false'
  DM_LLM_CLASSIFY: 'false'
  GEMINI_STREAM_NARRATION: 'true'
  AI_EMBEDDING_PROVIDER: gemini
  AI_PLATFORM_BILLING_ENABLED: ${AI_PLATFORM_BILLING_ENABLED:-false}
  AI_INCLUDED_CREDITS_DEFAULT: ${AI_INCLUDED_CREDITS_DEFAULT:-30}
  QDRANT_ENABLED: ${QDRANT_ENABLED:-true}
  QDRANT_URL: http://qdrant:6333
  QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-3072}
  SRD_API_BASE: http://srd-api:3000/api/2014
  MINIO_ENABLED: 'true'
  MINIO_ENDPOINT: minio
  MINIO_PORT: '9000'
  MINIO_USE_SSL: 'false'
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dndai_minio}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dndai_minio_secret}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-chronicles}
  PIPER_HTTP_URL: http://piper:5500
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8071/api}

services:
  backend-dev:
    profiles: ['dev']
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data:ro
      - ./data:/app/srd-data:ro
      - ./backend/logs:/app/logs
    environment:
      <<: *penai-dev-env
      PORT: 8071
    ports:
      - '8071:8071'
    entrypoint: ['/docker-entrypoint.sh']
    command: ['npx', 'tsx', 'watch', 'src/penaiServer.ts']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      qdrant:
        condition: service_started

  temporal-worker-dev:
    profiles: ['dev']
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data:ro
      - ./data:/app/srd-data:ro
    environment:
      <<: *penai-dev-env
      SKIP_TEMPORAL_WORKER: 'false'
      TEMPORAL_DISABLED: 'false'
    entrypoint: ['/docker-entrypoint.sh']
    command: ['npx', 'tsx', 'watch', 'src/temporalWorkerMain.ts']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

  frontend-dev:
    profiles: ['dev']
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Dev LAN: exporte NEXT_PUBLIC_* antes do compose (npm run dev:all:lan).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8071/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8071/}
      NEXT_PUBLIC_PENAI_UI: ${NEXT_PUBLIC_PENAI_UI:-true}
      WATCHPACK_POLLING: 'true'
    ports:
      - '9002:9002'
    command:
      - sh
      - -c
      - |
        if [ ! -x node_modules/.bin/next ]; then
          echo '[frontend-dev] Instalando dependências (npm ci)…'
          npm ci
        fi
        exec npm run dev -- -H 0.0.0.0
    depends_on:
      - backend-dev

volumes:
  frontend_node_modules:
