# Crônicas de Aventuras — serviços auxiliares (SRD, MinIO, Piper)
#
# Runtime PENAI (Postgres, Temporal, API): docker-compose.penai.yml
# Dev local: npm run dev:local
# Stack Docker hot reload: npm run dev:all
#
# URLs auxiliares: SRD :3000 · MinIO :9000 · Piper :5500

name: dndai

x-media-env: &media-env
  MINIO_ENABLED: 'true'
  MINIO_ENDPOINT: minio
  MINIO_PORT: '9000'
  MINIO_USE_SSL: 'false'
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dndai_minio}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dndai_minio_secret}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-chronicles}
  PIPER_HTTP_URL: http://piper:5500
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8071/api}

services:
  srd-db:
    image: ghcr.io/5e-bits/5e-database:latest
    restart: unless-stopped
    ports:
      - '27018:27017'

  srd-cache:
    image: redis:6.2.5
    restart: unless-stopped
    ports:
      - '6380:6379'

  srd-api:
    build:
      context: ./5e-srd-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://srd-db/5e-database
      REDIS_URL: redis://srd-cache:6379
    ports:
      - '3000:3000'
    depends_on:
      - srd-db
      - srd-cache
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/2014').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dndai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dndai_minio_secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  piper:
    build:
      context: ./docker/piper
      dockerfile: Dockerfile
    environment:
      PIPER_LENGTH_SCALE: ${PIPER_LENGTH_SCALE:-1.0}
    restart: unless-stopped
    ports:
      - '${PIPER_HTTP_PORT:-5500}:5500'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5500/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

volumes:
  minio_data:
