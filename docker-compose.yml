# Crônicas de Aventuras — Docker Compose
#
# Desenvolvimento (sem rebuild a cada save):
#   npm run dev:infra          # MySQL, Redis, SRD, MinIO, Piper
#   npm run dev:backend        # terminal 2 — hot reload
#   npm run dev                # terminal 3 — hot reload Next.js
#
# Stack completa em container (teste de produção):
#   docker compose --profile full up -d --build
# Narração: BullMQ no Redis. Profile `full`: API (SKIP_NARRATION_WORKERS) + narration-worker.
#
# URLs (dev local): http://localhost:9002 · http://localhost:8071/api/health

name: dndai

x-media-env: &media-env
  MINIO_ENABLED: 'true'
  MINIO_ENDPOINT: minio
  MINIO_PORT: '9000'
  MINIO_USE_SSL: 'false'
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dndai_minio}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dndai_minio_secret}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-chronicles}
  PIPER_HTTP_URL: http://piper:5500
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8071/api}
  NARRATION_BULL_CONCURRENCY: ${NARRATION_BULL_CONCURRENCY:-2}

x-ai-env: &ai-env
  AI_ENGINE: gemini
  AI_PROVIDER: gemini
  AI_DEFAULT_MODEL: gemini-2.5-flash
  AI_FAILOVER_CHAIN: gemini-2.5-flash,gemini-2.5-flash-lite
  AI_EMBEDDING_PROVIDER: gemini
  AI_OPENROUTER_ONLY: 'false'
  GEMINI_STREAM_NARRATION: 'true'
  AI_PLATFORM_BILLING_ENABLED: ${AI_PLATFORM_BILLING_ENABLED:-false}
  QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-2048}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dndai_root}
      MYSQL_DATABASE: ${DB_NAME:-dndai}
      MYSQL_USER: ${DB_USER:-dndai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dndai_secret}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  srd-db:
    image: ghcr.io/5e-bits/5e-database:latest
    restart: unless-stopped
    ports:
      - '27018:27017'

  srd-cache:
    image: redis:6.2.5
    restart: unless-stopped
    ports:
      - '6380:6379'

  srd-api:
    build:
      context: ./5e-srd-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://srd-db/5e-database
      REDIS_URL: redis://srd-cache:6379
    ports:
      - '3000:3000'
    depends_on:
      - srd-db
      - srd-cache
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/2014').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  # Rede interna — em produção não publique portas (só backend consome).
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dndai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dndai_minio_secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  piper:
    build:
      context: ./docker/piper
      dockerfile: Dockerfile
    environment:
      PIPER_LENGTH_SCALE: ${PIPER_LENGTH_SCALE:-1.0}
    restart: unless-stopped
    # Porta host só para debug local; backend usa http://piper:5500 na rede Docker.
    ports:
      - '${PIPER_HTTP_PORT:-5500}:5500'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5500/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  backend:
    profiles: ['full']
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8071
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-dndai}
      DB_PASSWORD: ${DB_PASSWORD:-dndai_secret}
      DB_NAME: ${DB_NAME:-dndai}
      DB_SYNC: ${DB_SYNC:-false}
      DB_MIGRATIONS_ONLY: 'false'
      REDIS_URL: redis://redis:6379
      SRD_API_BASE: http://srd-api:3000/api/2014
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AI_PIPELINE_MODE: ${AI_PIPELINE_MODE:-narration_only}
      SKIP_NARRATION_WORKERS: 'true'
      QDRANT_ENABLED: ${QDRANT_ENABLED:-false}
      QDRANT_URL: http://qdrant:6333
      <<: [*ai-env, *media-env]
    ports:
      - '8071:8071'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      srd-api:
        condition: service_started
      minio:
        condition: service_healthy
      piper:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8071/api/health']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  narration-worker:
    profiles: ['full']
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ['npx', 'tsx', 'src/narrationWorkerMain.ts']
    environment:
      NODE_ENV: production
      RUN_NARRATION_WORKER: 'true'
      NARRATION_WORKER_VERBOSE: 'true'
      LOG_NARRATION_PROMPT: 'true'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-dndai}
      DB_PASSWORD: ${DB_PASSWORD:-dndai_secret}
      DB_NAME: ${DB_NAME:-dndai}
      DB_SYNC: 'false'
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AI_PIPELINE_MODE: ${AI_PIPELINE_MODE:-narration_only}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      <<: [*ai-env, *media-env]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8071/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8071/}
    restart: unless-stopped
    ports:
      - '9002:9002'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9002').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  minio_data:
  qdrant_data:
