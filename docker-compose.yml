# Crônicas de Aventuras — Docker Compose
#
# Desenvolvimento (sem rebuild a cada save):
#   npm run dev:infra          # só MySQL, Redis, SRD
#   npm run dev:backend        # terminal 2 — hot reload
#   npm run dev                # terminal 3 — hot reload Next.js
#
# Stack completa em container (teste de produção):
#   docker compose --profile full up -d --build
#
# URLs (dev local): http://localhost:9002 · http://localhost:8071/api/health

name: dndai

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dndai_root}
      MYSQL_DATABASE: ${DB_NAME:-dndai}
      MYSQL_USER: ${DB_USER:-dndai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dndai_secret}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  srd-db:
    image: ghcr.io/5e-bits/5e-database:latest
    restart: unless-stopped
    ports:
      - '27018:27017'

  srd-cache:
    image: redis:6.2.5
    restart: unless-stopped
    ports:
      - '6380:6379'

  srd-api:
    build:
      context: ./5e-srd-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://srd-db/5e-database
      REDIS_URL: redis://srd-cache:6379
    ports:
      - '3000:3000'
    depends_on:
      - srd-db
      - srd-cache
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/2014').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  backend:
    profiles: ['full']
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8071
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-dndai}
      DB_PASSWORD: ${DB_PASSWORD:-dndai_secret}
      DB_NAME: ${DB_NAME:-dndai}
      DB_SYNC: ${DB_SYNC:-true}
      DB_MIGRATIONS_ONLY: 'false'
      REDIS_URL: redis://redis:6379
      SRD_API_BASE: http://srd-api:3000/api/2014
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AI_PIPELINE_MODE: ${AI_PIPELINE_MODE:-narration_only}
      QDRANT_ENABLED: ${QDRANT_ENABLED:-false}
    ports:
      - '8071:8071'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      srd-api:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8071/api/health']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  frontend:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8071/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8071/}
    restart: unless-stopped
    ports:
      - '9002:9002'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9002').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
